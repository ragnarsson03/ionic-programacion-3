<!-- Componente raíz de la aplicación (Shell Layout) -->
<ion-app class="bg-background dark:bg-slate-950 text-on-background transition-colors duration-300 font-['Inter']">

  <!-- TopAppBar (Mobile Only) -->
  <header class="md:hidden bg-white/90 dark:bg-slate-900/90 backdrop-blur-md fixed top-0 left-0 w-full z-50 border-b border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between px-4 h-16">
    <button class="text-secondary-container hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="font-['Inter'] font-bold text-slate-900 dark:text-white text-xl tracking-tight">Portafolio</div>
    <div class="flex items-center gap-2">
      <button (click)="toggleDarkMode()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
        @if (isDarkMode) {
          <span class="material-symbols-outlined text-yellow-400">light_mode</span>
        } @else {
          <span class="material-symbols-outlined text-slate-600 dark:text-slate-400">dark_mode</span>
        }
      </button>
      <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden flex items-center justify-center">
        <img src="assets/dog-dev/dog-dev.jpeg" alt="Yo" class="w-full h-full object-cover">
      </div>
    </div>
  </header>

  <!-- NavigationDrawer (Desktop Only) -->
  <nav class="hidden md:flex flex-col py-6 h-full bg-white dark:bg-slate-900 fixed left-0 top-0 w-72 rounded-r-2xl divide-y divide-slate-100 dark:divide-slate-800 shadow-2xl z-40 transition-colors">
    <div class="px-6 mb-6">
      <div class="text-2xl font-black text-slate-900 dark:text-white mb-6 font-display">Portafolio</div>
      <div class="flex items-center gap-4">
        <img src="assets/dog-dev/dog-dev.jpeg" alt="Profile Avatar" class="w-12 h-12 rounded-full object-cover border-2 border-slate-200 dark:border-slate-700 bg-slate-100">
        <div>
          <div class="font-['Inter'] text-sm font-semibold text-slate-700 dark:text-slate-200">Frederick Durán</div>
          <div class="text-xs text-slate-500 dark:text-slate-400">Desarrollador Web</div>
        </div>
      </div>
    </div>
    
    <!-- Renderizador dinámico de Rutas Menu Desktop -->
    <div class="flex-1 overflow-y-auto py-4 flex flex-col justify-between">
      <div>
        @for (p of appPages; track p.title) {
          <a [routerLink]="[p.url]" routerLinkActive="bg-blue-50 dark:bg-slate-800 text-blue-700 dark:text-blue-400" [routerLinkActiveOptions]="{exact: false}"
             class="flex items-center gap-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg mx-2 my-1 px-4 py-3 hover:translate-x-1 transition-all duration-200 ease-in-out font-['Inter'] text-sm font-semibold cursor-pointer">
            <span class="material-symbols-outlined">{{ p.icon }}</span> 
            {{ p.title }}
          </a>
        }
      </div>

      <!-- Botón de Tema (Modo Oscuro/Claro) -->
      <div class="px-4 mt-auto mb-4">
        <button (click)="toggleDarkMode()" class="w-full flex items-center justify-center gap-3 py-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-slate-700 dark:text-slate-200 font-semibold text-sm">
          @if (isDarkMode) {
            <span class="material-symbols-outlined text-yellow-400">light_mode</span> Modo Claro
          } @else {
            <span class="material-symbols-outlined text-blue-600">dark_mode</span> Modo Oscuro
          }
        </button>
      </div>
    </div>
  </nav>

  <!-- Enrutador principal del contenido (Router Outlet interviene aquí) -->
  <ion-router-outlet id="main-content"></ion-router-outlet>

  <!-- BottomNavBar (Mobile Only) -->
  <nav class="md:hidden bg-white dark:bg-slate-900 fixed bottom-0 left-0 w-full z-50 rounded-t-xl border-t border-slate-200 dark:border-slate-800 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] flex justify-around items-center h-16 px-2 pb-safe transition-colors">
    @for (p of appPages; track p.title) {
      <a [routerLink]="[p.url]" routerLinkActive="text-secondary-container dark:text-blue-400 bg-secondary-container/10 dark:bg-slate-800" [routerLinkActiveOptions]="{exact: false}"
         class="flex flex-col items-center justify-center w-16 h-12 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 active:scale-95 transition-all duration-200 relative no-underline">
        <span class="material-symbols-outlined text-[24px] mb-0.5">{{ p.icon }}</span>
        <span class="text-[10px] font-['Inter'] font-semibold tracking-wide">{{ p.title }}</span>
      </a>
    }
  </nav>

</ion-app>
