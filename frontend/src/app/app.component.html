<!-- Componente raíz de la aplicación. -->
<ion-app>

  <ion-split-pane contentId="main-content">

    <ion-menu contentId="main-content" type="overlay">
      <ion-content>

        <div class="flex flex-col items-center justify-center py-6 border-b border-gray-700 bg-gray-900">
          <img src="assets/logo_uneti_fondo_negro.jpeg" alt="UNETI Logo" class="w-16 h-16 rounded-full mb-3 shadow-md">
          <ion-list-header class="text-xl font-bold text-white p-0">UNETI App</ion-list-header>
          <ion-note class="text-xs opacity-60">Frederick Samir Durán</ion-note>
        </div>

        <ion-list id="nav-list" class="bg-transparent mt-2">
          @for (p of appPages; track p.title) {
            <ion-menu-toggle auto-hide="false">
              <ion-item
                routerDirection="root"
                [routerLink]="[p.url]"
                lines="none"
                detail="false"
                routerLinkActive="selected"
                class="rounded-lg mx-3 my-1">
                <ion-icon aria-hidden="true" slot="start" [name]="p.icon" class="text-xl"></ion-icon>
                <ion-label class="font-medium">{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>

        <!-- Footer del menú con link a GitHub -->
        <div class="absolute bottom-4 w-full px-6 opacity-40 hover:opacity-100 transition-opacity">
          <a href="https://github.com/ragnarsson03" target="_blank" class="flex items-center gap-2 text-xs no-underline text-white">
            <ion-icon name="logo-github"></ion-icon>
            <span>ragnarsson03</span>
          </a>
        </div>

      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>

  </ion-split-pane>
</ion-app>
