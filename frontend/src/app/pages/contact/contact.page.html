<!-- Página de Contacto: Presenta un formulario reactivo simple con manejo de eventos -->
<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-menu-button slot="start"></ion-menu-button>
    <ion-title>Contacto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="contact-content">

  <ion-card class="animate__animated animate__fadeInDown">
    <ion-card-header>
      <ion-card-title>Envíame un mensaje</ion-card-title>
      <ion-card-subtitle>Respondo en menos de 24 horas</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>

      <!-- [(ngModel)]: Two-Way Data Binding. El valor del input se sincroniza
           bidireccionalmente con la variable TypeScript en tiempo real. -->
      <ion-item>
        <ion-label position="floating">Tu nombre</ion-label>
        <ion-input [(ngModel)]="formNombre" type="text" placeholder="Ej: Carlos Márquez"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Tu mensaje</ion-label>
        <!-- ion-textarea: Área de texto multi-línea para mensajes largos -->
        <ion-textarea [(ngModel)]="formMensaje" rows="4" placeholder="Escribe aquí tu mensaje..."></ion-textarea>
      </ion-item>

      <br>

      <!-- (click): Event Binding. Ejecuta el método 'enviarMensaje()' del
           controlador TypeScript cuando el usuario hace clic en el botón. -->
      <ion-button expand="block" color="primary" (click)="enviarMensaje()">
        <ion-icon name="send-outline" slot="start"></ion-icon>
        Enviar Mensaje
      </ion-button>

    </ion-card-content>
  </ion-card>

  <!-- Tarjeta con canales de contacto alternativos -->
  <ion-card class="animate__animated animate__fadeInUp">
    <ion-card-header>
      <ion-card-title>También me encuentras en</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item button detail="true">
          <ion-icon name="logo-github" slot="start"></ion-icon>
          <ion-label>GitHub: /frederick-duran</ion-label>
        </ion-item>
        <ion-item button detail="true">
          <ion-icon name="mail-outline" slot="start" color="danger"></ion-icon>
          <ion-label>samirduran999@gmail.com</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

</ion-content>
