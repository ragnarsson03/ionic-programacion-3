<!-- Página de Información Personal: Simula una hoja de vida del estudiante.
     Usa Data-Binding para mostrar datos definidos en profile.page.ts -->
<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-menu-button slot="start"></ion-menu-button>
    <ion-title>Info Personal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="profile-content">

  <!-- Avatar y datos principales del estudiante usando interpolación {{ }} -->
  <div class="profile-header animate__animated animate__fadeIn">
    <ion-avatar class="profile-avatar">
      <ion-icon name="person-circle-outline"></ion-icon>
    </ion-avatar>
    <!-- Interpolación: {{ nombre }} extrae el valor de la variable 'nombre' en el .ts -->
    <h1>{{ nombre }}</h1>
    <p>{{ carrera }}</p>
  </div>

  <!-- Tarjeta con los datos académicos. Todos los valores vienen por Data-Binding -->
  <ion-card class="animate__animated animate__slideInUp">
    <ion-card-header>
      <ion-card-title>Datos Académicos</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="full">
        <ion-item>
          <ion-icon name="id-card-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Cédula</h3>
            <!-- Property Binding: [value] ata el atributo al valor de la variable TypeScript -->
            <p>{{ cedula }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="school-outline" slot="start" color="secondary"></ion-icon>
          <ion-label>
            <h3>Institución</h3>
            <p>{{ institucion }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="book-outline" slot="start" color="tertiary"></ion-icon>
          <ion-label>
            <h3>Trayecto / Módulo</h3>
            <p>{{ trayecto }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="code-slash-outline" slot="start" color="success"></ion-icon>
          <ion-label>
            <h3>Stack Principal</h3>
            <p>{{ stack }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

</ion-content>
